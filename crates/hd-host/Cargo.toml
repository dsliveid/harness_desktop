[package]
name = "hd-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "harness_desktop 桌面宿主壳（Tauri 2）：token vault / runner 守护 / IPC 控制面"

[features]
default = []
# GUI 层（Tauri 2）默认关闭，原因见 lib.rs 顶部注释：
# 1) GUI 依赖需要 WebView2（Windows）/ 系统 webkit（Linux），无 GUI 的 CI 上装不出来；
# 2) 纯逻辑层（vault / daemon / commands）刻意不依赖任何 GUI 库，
#    这样 `cargo test -p hd-host` 在任意环境都能秒级跑完。
gui = ["dep:tauri", "dep:tauri-plugin-single-instance"]

# 🔴 Tauri 2 的强约定：release 构建必须开 `custom-protocol`，否则前端资源
# **不会**被嵌入二进制，可执行文件一启动就因找不到 `frontendDist` 而退出。
#
# 实证：本项目曾漏掉它，`hd-host.exe` release 构建「成功」但双击即死，
# 且 `windows_subsystem = "windows"` 把报错也吞了，表现为「无任何反应的闪退」。
# 排查成本极高，故在此显式声明并把「release = gui + custom-protocol」写成惯例：
#   debug  : cargo run -p hd-host --features gui
#   release: cargo build -p hd-host --release --features gui,custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# 复用已有地基，别重写：工作区根目录白名单校验（hd-core::Policy）、
# 退避策略与 token 打码（hd-runner::ReconnectPolicy / ipc::redact_token）。
hd-core = { path = "../hd-core" }
hd-protocol = { path = "../hd-protocol" }
hd-runner = { path = "../hd-runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# 令牌明文在内存里必须能被清零：手写 unsafe 清零会被 #![deny(unsafe_code)] 拦下，
# 因此用 zeroize（它内部做了 volatile 写 + 编译器屏障）。
zeroize = "1"
tracing = "0.1"
# 仅配对用（设计文档 §14.3 明确许可）：把 device_token 从 HTTP 响应直接接进
# DeviceToken(zeroize)，避免令牌经过 WebView 的 JS 堆。
# 用 rustls 而非 native-tls：免去 Windows 上对 OpenSSL/schannel 的构建依赖。
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "charset",
    "http2",
] }
url = "2"
# 推导平台配置目录（%APPDATA% / ~/.config），用于存放配对档案。
# 不用 std::env::current_dir：进程工作目录可能是用户随便点开的位置，甚至只读。
dirs = "5"
# 单实例锁（见 src/instance_lock.rs）。rust-version = 1.79，std 的 File::try_lock
# 尚不可用（1.89 才稳定），故用 fs2 提供 try_lock_exclusive。
# 必须用 OS 独占锁而不是「读 pid 判活」：pid 会被复用，且进程崩溃后 std 无法自动清理。
fs2 = "0.4"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "time",
    "fs",
] }
# 可选 GUI 依赖：默认不参与编译。
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

# 各平台只启用对应的原生密钥链后端，避免在 Linux 上把 libdbus/openssl 拖进来。
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
# test-util 提供 start_paused（虚拟时钟），让退避重试的单测不用真等 30 秒。
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

# GUI 入口需要 feature gui，默认不编译（原因见 src/lib.rs 顶部）。
[[bin]]
name = "hd-host"
path = "src/main.rs"
required-features = ["gui"]

# 🔴 build.rs 是**必需**的，用来在 gui 构建时编入 Windows manifest。
#
# 曾经这里写着「刻意不设 build.rs，避免无条件跑 GUI 工具链」——那是错的取舍：
# 没有 manifest，Tauri 用到的 TaskDialogIndirect（Common-Controls v6 专有）
# 在运行时定位不到，exe 一启动就弹「无法找到入口」错误框。
#
# 现在改为：build.rs 存在，但其内容按 `cfg(feature = "gui")` 门控 ——
# 纯逻辑构建（cargo test）下它什么也不做，既保留分层，又保证 GUI 可运行。
[build-dependencies]
tauri-build = { version = "2", features = [] }
