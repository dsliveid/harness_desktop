<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>harness 桌面端 · 内置基线</title>
    <!--
      为什么把骨架写成静态 HTML 而不是全靠 JS 生成：
      基线是「壳里的最后一道兜底界面」。若脚本自身加载失败/抛错，静态骨架仍能让用户
      看到标题、说明与按钮（虽不可用），而不是一片白屏 —— 这是 §14.5 的硬要求。
      main.ts 只负责「增强」：探测服务端、探测能力、按结果置灰与写状态文案。
    -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="hd">
        <h1>harness 桌面端</h1>
        <p class="sub">内置基线界面 · 远程 UI 未加载时的最小可用壳</p>
      </header>

      <!-- aria-live：状态变化对读屏器可播报（错误态是这台界面的主要输出） -->
      <section id="server-status" class="card status" data-state="checking" aria-live="polite">
        <strong class="line-title">服务端连接</strong>
        <p class="line-detail">正在探测服务端…</p>
      </section>

      <!--
        执行引擎（Runner）生命周期状态。
        与「服务端连接」分开两张卡：服务端可达但 Runner 可能已崩/在重连，
        两者的排障动作完全不同（前者查网络/服务端，后者查本机进程）。
      -->
      <section id="runner-status" class="card status" data-state="checking" aria-live="polite">
        <strong class="line-title">执行引擎</strong>
        <p class="line-detail">正在读取执行引擎状态…</p>
      </section>

      <section id="capability-status" class="card status" data-state="checking" aria-live="polite">
        <strong class="line-title">本机能力</strong>
        <p class="line-detail">正在读取客户端能力清单…</p>
      </section>

      <section class="card actions">
        <div class="action">
          <button type="button" data-cmd="check_update" disabled>检查更新</button>
          <p class="reason" data-reason-for="check_update"></p>
        </div>
        <div class="action">
          <button type="button" data-cmd="open_settings" disabled>打开设置</button>
          <p class="reason" data-reason-for="open_settings"></p>
        </div>
        <div class="action">
          <button type="button" data-cmd="open_logs" disabled>查看日志</button>
          <p class="reason" data-reason-for="open_logs"></p>
        </div>
      </section>

      <!--
        解除配对是**不可逆**操作（清掉密钥链令牌，只能重走配对码流程），
        因此单独一块、带说明与二次确认，不和日常按钮混在一起。
      -->
      <section class="card actions danger">
        <strong class="line-title">设备绑定</strong>
        <div class="action">
          <button type="button" data-cmd="unpair_device" disabled>解除配对</button>
          <p class="reason" data-reason-for="unpair_device"></p>
        </div>
        <p class="hint">解除后将清除本机保存的设备令牌，需要重新输入配对码才能继续使用。</p>
      </section>

      <footer class="foot">
        <p id="diag" class="diag">诊断信息加载中…</p>
      </footer>
    </div>

    <noscript>
      <p class="noscript">脚本被禁用：基线界面无法探测服务端与本机能力，仅显示静态说明。</p>
    </noscript>

    <!-- 原生 ES module，零打包依赖：构建时 esbuild 会把 src/baseline/main.ts 打成 ./main.js -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
